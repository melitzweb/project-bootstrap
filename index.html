<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap demo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css"
        integrity="sha512-2bBQCjcnw658Lho4nlXJcc6WkV/UxpE/sAokbXPxQNGqmNdQrWqtw26Ns9kFF/yG792pKR1Sx8/Y1Lf1XN4GKA=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container my-5">
        <h1 class="text-center titulo">Patagonia Argentina</h1>
    </div>
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <div class="card mx-auto" style="width: 25rem;">
                    <img src="images/el-chalten.png" alt="el-chalten" class="card-img-top">
                    <div class="card-header bg-primary text-white text-center py-4">
                        <h5 class="card-title fw-bold m-0"> Patagonia Trekking </h5>
                        <small class="text-white-50">El Chaltén · Argentina</small>

                    </div>
                    <div class="card-body text-center p-4">
                        <p class="card-text text-muted"> Este es un sendero exigente, pero perfecto para quienes buscan una verdadera aventura.</p>
                        <a href="#" class="btn btn-primary"> Ver más </a>

                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
